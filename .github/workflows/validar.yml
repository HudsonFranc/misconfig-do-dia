name: Validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cenarios:
    name: Validar cenários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validar formato dos cenários
        run: node scripts/validar-cenarios.mjs cenarios

  build:
    name: Checar tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Astro check
        run: npx astro check
      - name: Build
        run: npm run build